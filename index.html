<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyFlow</title><style>body{margin:0;background:#f5f7fb;color:#182230;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:800}.brand b{color:#4f6df5}.sub{color:#718096}.btn{border:0;border-radius:12px;padding:11px 15px;background:#4f6df5;color:#fff;font-weight:700;cursor:pointer}.stats{display:flex;gap:12px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e7ebf2;border-radius:18px;padding:18px;box-shadow:0 5px 18px #24345b0a}.card{flex:1}.card strong{display:block;font-size:26px}.card small{color:#718096}.tools{display:flex;gap:10px}.tools input,.tools select{flex:1;padding:11px;border:1px solid #e1e6ef;border-radius:10px;font:inherit}.empty{text-align:center;color:#718096;padding:45px}@media(max-width:600px){.stats{flex-direction:column}.top{align-items:flex-start;gap:14px;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">Study<b>Flow</b></div><div class="sub">Your school task dashboard</div></div><button class="btn" onclick="alert('Connect this interface to your private backend to load tasks.')">＋ Add task</button></header><section class="stats"><div class="card"><strong>0</strong><small>Open tasks</small></div><div class="card"><strong>0</strong><small>Overdue</small></div><div class="card"><strong>0</strong><small>Completed</small></div></section><section class="panel"><div class="tools"><input placeholder="Search tasks…"><select><option>All tasks</option><option>Open</option><option>Completed</option></select><button class="btn" onclick="alert('Sync requires the private backend.')">↻ Sync</button></div><div class="empty">Your private tasks will appear here after a secure backend is connected.</div></section></main></body></html>
